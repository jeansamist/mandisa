    parameters:
      - in: path
        name: transactionId
        description: ""
        required: true
        schema:
          type: string
          examples:
            - TXN_ABC123DEF456
  /api/v1/payouts:
    get:
      summary: List payouts
      operationId: listPayouts
      description: Returns a paginated list of payouts created by your app, most
        recent first.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        payout_id:
                          type: string
                          examples:
                            - POabcdef1234567890abcdef1234567890
                        status:
                          type: string
                          examples:
                            - completed
                        amount:
                          type: object
                          properties:
                            total:
                              type: number
                              examples:
                                - 5000
                            currency:
                              type: string
                              examples:
                                - XAF
                        payout_method:
                          type: string
                          examples:
                            - mtn_mobile_money
                        recipient:
                          type: object
                          properties:
                            phone:
                              type: string
                              examples:
                                - "+237600000000"
                            name:
                              type: string
                              examples:
                                - Jane Doe
                        reference:
                          type: string
                          examples:
                            - refund-ORD-123
                        created_at:
                          type: string
                          examples:
                            - 2026-05-20T10:30:00+00:00
                        completed_at:
                          type: string
                          examples:
                            - 2026-05-20T10:31:42+00:00
                    examples:
                      - - payout_id: POabcdef1234567890abcdef1234567890
                          status: completed
                          amount:
                            total: 5000
                            currency: XAF
                          payout_method: mtn_mobile_money
                          recipient:
                            phone: "+237600000000"
                            name: Jane Doe
                          reference: refund-ORD-123
                          created_at: 2026-05-20T10:30:00+00:00
                          completed_at: 2026-05-20T10:31:42+00:00
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        examples:
                          - 1
                      per_page:
                        type: integer
                        examples:
                          - 20
                      total:
                        type: integer
                        examples:
                          - 1
                      has_more:
                        type: boolean
                        examples:
                          - false
                examples:
                  - success: true
                    data:
                      - payout_id: POabcdef1234567890abcdef1234567890
                        status: completed
                        amount:
                          total: 5000
                          currency: XAF
                        payout_method: mtn_mobile_money
                        recipient:
                          phone: "+237600000000"
                          name: Jane Doe
                        reference: refund-ORD-123
                        created_at: 2026-05-20T10:30:00+00:00
                        completed_at: 2026-05-20T10:31:42+00:00
                    pagination:
                      current_page: 1
                      per_page: 20
                      total: 1
                      has_more: false
      tags:
        - Payouts
    post:
      summary: Create a payout
      operationId: createAPayout
      description: >-
        Send funds from your available balance to a recipient. Requires
        sufficient

        balance in the requested currency.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  data:
                    type: object
                    properties:
                      payout_id:
                        type: string
                        examples:
                          - POabcdef1234567890abcdef1234567890
                      status:
                        type: string
                        examples:
                          - processing
                      amount:
                        type: object
                        properties:
                          total:
                            type: number
                            examples:
                              - 5000
                          currency:
                            type: string
                            examples:
                              - XAF
                      payout_method:
                        type: string
                        examples:
                          - mtn_mobile_money
                      recipient:
                        type: object
                        properties:
                          phone:
                            type: string
                            examples:
                              - "+237600000000"
                          name:
                            type: string
                            examples:
                              - Jane Doe
                      reference:
                        type: string
                        examples:
                          - refund-ORD-123
                      created_at:
                        type: string
                        examples:
                          - 2026-05-20T10:30:00+00:00
                examples:
                  - success: true
                    data:
                      payout_id: POabcdef1234567890abcdef1234567890
                      status: processing
                      amount:
                        total: 5000
                        currency: XAF
                      payout_method: mtn_mobile_money
                      recipient:
                        phone: "+237600000000"
                        name: Jane Doe
                      reference: refund-ORD-123
                      created_at: 2026-05-20T10:30:00+00:00
        "422":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    examples:
                      - Validation failed
                  message:
                    type: string
                    examples:
                      - The given data was invalid
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The amount field is required.
                      payout_method:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The selected payout method is invalid.
                      recipient_name:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The recipient name field is required.
                examples:
                  - error: Validation failed
                    message: The given data was invalid
                    errors:
                      amount:
                        - The amount field is required.
                      payout_method:
                        - The selected payout method is invalid.
                      recipient_name:
                        - The recipient name field is required.
      tags:
        - Payouts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: Must be at least 100.
                  examples:
                    - 95
                currency:
                  type: string
                  description: ""
                  enum:
                    - XAF
                    - XOF
                    - EUR
                    - KES
                  examples:
                    - KES
                payout_method:
                  type:
                    - string
                    - "null"
                  description: >-
                    Legacy fixed method OR an explicit payment-channel code (any

                    active payout channel, e.g. AIRTEL_GAB). Exactly one is
                    required. This field is required when
                    <code>channel_code</code> is not present.
                  enum:
                    - mtn_mobile_money
                    - orange_money
                    - bank_transfer
                  examples:
                    - mtn_mobile_money
                channel_code:
                  type:
                    - string
                    - "null"
                  description: This field is required when <code>payout_method</code> is not
                    present.
                  examples:
                    - architecto
                recipient_name:
                  type: string
                  description: Must not be greater than 255 characters.
                  examples:
                    - n
                recipient_email:
                  type:
                    - string
                    - "null"
                  description: Must be a valid email address. Must not be greater than 255
                    characters.
                  examples:
                    - ashly64@example.com
                bank_account_number:
                  type: string
                  description: >-
                    Check-digit validated: a bank payout is settled by hand, so
                    a typo

                    costs a returned transfer days later rather than an instant

                    rejection from a provider. Must not be greater than 50
                    characters.
                  examples:
                    - v
                bank_name:
                  type: string
                  description: Must not be greater than 100 characters.
                  examples:
                    - d
                bank_code:
                  type: string
                  description: Must not be greater than 20 characters.
                  examples:
                    - ljnikhwaykcmyuwp
                description:
                  type: string
                  description: Must not be greater than 500 characters.
                  examples:
                    - Qui commodi incidunt iure odit.
                reference:
                  type: string
                  description: Must not be greater than 255 characters.
                  examples:
                    - s
              required:
                - amount
                - recipient_name
