        single-use and expires in 24h, so the common cases — the merchant never

        opened the email, opened it on the wrong device, or needs to fix a

        rejection — all end with the platform asking for a fresh one.


        Issuing invalidates the previous link. That is deliberate: it keeps at
        most

        one live credential per merchant, so revoking is just "issue and
        discard".
