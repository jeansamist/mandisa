openapi: 3.1.0
info:
  title: Elgiopay API Documentation
  description: Accept mobile money, card, and bill payments across West and Central Africa.
  version: 1.0.0
servers:
  - url: https://sandbox-api.elgiopay.com
tags:
  - name: Webhooks
    description: >-
      Elgiopay POSTs an event to your configured webhook URL whenever a payment
      or payout reaches a terminal state. Use webhooks to update your own
      database, send receipts, fulfil orders, or notify your users — anything
      you would otherwise discover by polling `GET /payments/{transaction_id}`.


      Configure webhooks from your **app dashboard**: paste one or more HTTPS
      URLs, enable delivery, and copy your **signing secret** (a `whsec_…`
      string). The secret is shown only once — at creation and after each
      rotation — so store it server-side immediately.


      ## Events


      | Event | Fired when |

      |---|---|

      | `payment.completed` | A charge succeeds and funds settle to your
      balance. |

      | `payment.failed` | A charge is declined or the customer cancels. |

      | `payment.pin_available` | A prepaid voucher/token PIN has been issued
      for a completed bill or subscription payment. Fires only for transactions
      that produce an out-of-band PIN (e.g. Maviance prepaid subscriptions);
      arrives after `payment.completed`, once the upstream provider releases the
      PIN. The `data.pin` field carries the value — deliver it to your customer
      over a secure channel. |

      | `payout.completed` | A payout has been disbursed to the recipient. |

      | `payout.failed` | A payout was rejected by the provider. |


      We do **not** emit events for intermediate states (`pending`,
      `processing`). If you need those, poll the relevant `GET` endpoint.


      ## Payload


      Every webhook is a POST with `Content-Type: application/json` and the
      following envelope:


      ```json

      {
        "id": "evt_3aB9xK2pQrSt7uVwXyZ1mN5oPqRsTuVw",
        "event": "payment.completed",
        "created": 1716200000,
        "data": { ... }
      }

      ```


      | Field | Description |

      |---|---|

      | `id` | Unique event id. Use it for deduplication — the same id may be
      delivered more than once. |

      | `event` | The event type (see table above). |

      | `created` | Unix timestamp of when the event was created. |

      | `data` | The same object you would receive from the corresponding `GET`
      endpoint. For `payment.*` it matches `GET /v1/payments/{transaction_id}`;
      for `payout.*` it matches `GET /v1/payouts/{payout_id}`. |


      ## Signature verification


      Every request includes:


      ```

      X-Elgiopay-Signature: t=1716200000,v1=5b1c…

      X-Elgiopay-Event: payment.completed

      X-Elgiopay-Event-Id: evt_3aB9xK2pQrSt7uVwXyZ1mN5oPqRsTuVw

      ```


      - `t` — Unix timestamp the signature was generated at.

      - `v1` — HMAC-SHA256 hex digest of `"{t}.{raw_request_body}"` using your
      `whsec_…` secret.


      To verify a webhook:


      1. Read the **raw** request body. Do not parse it first — even
      reformatting whitespace will break the signature.

      2. Parse the `X-Elgiopay-Signature` header into `t` and `v1`.

      3. Reject the request if `t` is more than **5 minutes** in the past — this
      prevents replay attacks.

      4. Compute `expected = HMAC_SHA256(secret, t + "." + raw_body)`.

      5. Compare `expected` to `v1` using a **constant-time** comparison
      (`hash_equals` in PHP, `crypto.timingSafeEqual` in Node).

      6. If they match, dedupe by `X-Elgiopay-Event-Id` and process.


      ### PHP


      ```php

      $payload = file_get_contents('php://input');

      $header = $_SERVER['HTTP_X_ELGIOPAY_SIGNATURE'] ?? '';

      $parts = [];

      foreach (explode(',', $header) as $kv) {
          [$k, $v] = explode('=', $kv, 2);
          $parts[$k] = $v;
      }

      if (abs(time() - (int) $parts['t']) > 300) {
          http_response_code(400); exit('stale');
      }

      $expected = hash_hmac('sha256', $parts['t'].'.'.$payload, $webhookSecret);

      if (!hash_equals($expected, $parts['v1'])) {
          http_response_code(400); exit('bad signature');
      }

      $event = json_decode($payload, true);

      ```


      ### Node.js / JavaScript


      ```js

      const crypto = require('crypto');


      app.post('/webhook', express.raw({ type: 'application/json' }), (req, res)
      => {
        const header = req.header('X-Elgiopay-Signature') || '';
        const parts = Object.fromEntries(header.split(',').map(kv => kv.split('=')));
        if (Math.abs(Date.now() / 1000 - Number(parts.t)) > 300) {
          return res.status(400).send('stale');
        }
        const expected = crypto
          .createHmac('sha256', process.env.ELGIOPAY_WEBHOOK_SECRET)
          .update(`${parts.t}.${req.body.toString()}`)
          .digest('hex');
        if (!crypto.timingSafeEqual(Buffer.from(expected), Buffer.from(parts.v1))) {
          return res.status(400).send('bad signature');
        }
        const event = JSON.parse(req.body.toString());
        res.status(200).send('ok');
      });

      ```


      ### Python


      ```python

      import hmac, hashlib, time


      def verify(raw_body: bytes, header: str, secret: str) -> dict:
          parts = dict(p.split('=', 1) for p in header.split(','))
          if abs(time.time() - int(parts['t'])) > 300:
              raise ValueError('stale')
          signed = f"{parts['t']}.{raw_body.decode()}".encode()
          expected = hmac.new(secret.encode(), signed, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, parts['v1']):
              raise ValueError('bad signature')
          import json
          return json.loads(raw_body)
      ```


      ### Go


      ```go

      import (
          "crypto/hmac"
          "crypto/sha256"
          "encoding/hex"
          "io"
          "net/http"
          "strconv"
          "strings"
          "time"
      )


      func verify(r *http.Request, secret string) ([]byte, error) {
          body, _ := io.ReadAll(r.Body)
          parts := map[string]string{}
          for _, kv := range strings.Split(r.Header.Get("X-Elgiopay-Signature"), ",") {
              if i := strings.IndexByte(kv, '='); i >= 0 {
                  parts[kv[:i]] = kv[i+1:]
              }
          }
          t, _ := strconv.ParseInt(parts["t"], 10, 64)
          if time.Now().Unix()-t > 300 || t-time.Now().Unix() > 300 {
              return nil, http.ErrAbortHandler
          }
          mac := hmac.New(sha256.New, []byte(secret))
          mac.Write([]byte(parts["t"] + "." + string(body)))
          expected := hex.EncodeToString(mac.Sum(nil))
          if !hmac.Equal([]byte(expected), []byte(parts["v1"])) {
              return nil, http.ErrAbortHandler
          }
          return body, nil
      }

      ```


      ### Ruby


      ```ruby

      require 'openssl'


      def verify(raw_body, header, secret)
        parts = header.split(',').map { |kv| kv.split('=', 2) }.to_h
        raise 'stale' if (Time.now.to_i - parts['t'].to_i).abs > 300
        expected = OpenSSL::HMAC.hexdigest('SHA256', secret, "#{parts['t']}.#{raw_body}")
        raise 'bad signature' unless Rack::Utils.secure_compare(expected, parts['v1'])
        JSON.parse(raw_body)
      end

      ```


      ## Retries


      If your endpoint does not return a `2xx` status code within 30 seconds, we
      retry with exponential backoff:


      | Attempt | Delay |

      |---|---|

      | 2 | 1 minute |

      | 3 | 5 minutes |

      | 4 | 30 minutes |

      | 5 | 2 hours |

      | 6 | 6 hours |

      | 7 | 12 hours |

      | 8 (final) | 24 hours |


      After 7 retries (~45 hours later) the delivery is marked permanently
      failed. You can manually resend any delivery from the **Webhook
      deliveries** page in your dashboard.


      ## Best practices


      - **Return 2xx fast.** Acknowledge receipt within a few seconds, queue
      heavy work for later. Long handlers cause unnecessary retries.

      - **Dedupe by `id`.** The same event id may be delivered more than once —
      both because of network retries and manual resends. Track which event ids
      you have processed.

      - **Use HTTPS.** Plain `http://` URLs are accepted but expose your secret
      and payloads in transit.

      - **Rotate your secret periodically.** Rotation invalidates the previous
      secret immediately, so plan a deployment.

      - **Never trust unverified webhooks.** Always verify the signature before
      reading any field from `data`.
  - name: Testing
    description: >-
      The sandbox replays deterministic outcomes — no real money moves and no
      real provider is contacted. Outcomes are driven by the `customer_phone`
      you send on `POST /payments` (or the `recipient_phone` you send on `POST
      /payouts`). Any phone not listed below falls back to a successful payment
      (`completed`, `error_code: 0`).


      ## Mobile money — phone-driven scenarios


      Two number ranges are reserved by the simulator:


      - `699000XXX` → Orange Money flavour

      - `677000XXX` → MTN MoMo flavour


      Behaviour is identical between the two ranges, so each row below applies
      to the matching `699000XXX` *and* `677000XXX` number.


      ### Success and pending-then-success


      | Phone (Orange / MTN) | Outcome | After |

      |---|---|---|

      | `699000000` / `677000000` | `completed` | Immediate |

      | `699000010` / `677000010` | `completed` | 10 seconds |

      | `699000030` / `677000030` | `completed` | 30 seconds |

      | `699000060` / `677000060` | `completed` | 1 minute |

      | `699000120` / `677000120` | `completed` | 2 minutes |


      The delayed numbers initially return `status: "pending"`. `GET
      /payments/{transaction_id}` keeps returning `pending` until the wall clock
      crosses the completion time, then flips to `completed`. Use them to verify
      your polling and webhook handling end-to-end.


      ### Failures


      All failures return `status: "failed"` with a 4-digit `error_code` in the
      `9200` range so they're never confused with a real provider error.


      | Phone (Orange / MTN) | `error_code` | Meaning |

      |---|---|---|

      | `699000201` / `677000201` | `9201` | Customer rejected the USSD/STK
      prompt |

      | `699000202` / `677000202` | `9202` | Insufficient balance on the
      customer's wallet |

      | `699000203` / `677000203` | `9203` | Customer did not confirm in time
      (timeout) |

      | `699000204` / `677000204` | `9204` | Generic transaction failure |


      ### Default


      Any phone number not in the tables above resolves to an immediate
      `completed` outcome. This mirrors MTN's own sandbox behaviour ("any other
      number → success").


      ### Payouts


      The same tables apply to `POST /payouts`. Send the test number as
      `recipient_phone` — the simulator picks the matching outcome and `GET
      /payouts/{payout_id}` follows the same `pending` → `completed` / `failed`
      flow.


      ## Putting it together


      1. Authenticate with a `pk_test_…` key against
      `https://sandbox-api.elgiopay.com`.

      2. Issue `POST /payments` (or `POST /payouts`) using one of the test phone
      numbers above.

      3. Poll `GET /payments/{transaction_id}` (or wait for your webhook) until
      the status reaches a terminal state.

      4. Pair a delayed-success number (`699000060`, `677000120`, …) with a real
      webhook URL to validate your end-to-end pipeline before going live.
  - name: Cards
    description: ""
  - name: Channels
    description: ""
  - name: Endpoints
    description: ""
  - name: Payments
    description: ""
  - name: Payouts
    description: ""
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: Generate your API keys from your <a href="/dashboard">app
        dashboard</a>. Use <code>pk_test_</code> keys for the sandbox and
        <code>pk_live_</code> keys for production.
security:
  - default: []
paths:
  /api/v1/balance:
    get:
      summary: Get balance
      operationId: getBalance
      description: Returns your app's available, pending, and total balance for the
        requested currency.
      parameters:
        - in: query
          name: currency
          description: "Currency code (XAF, XOF, EUR). Default: XAF."
          required: false
          schema:
            type: string
            description: "Currency code (XAF, XOF, EUR). Default: XAF."
            examples:
              - XAF
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  data:
                    type: object
                    properties:
                      currency:
                        type: string
                        examples:
                          - XAF
                      available_balance:
                        type: number
                        examples:
                          - 124500
                      pending_balance:
                        type: number
                        examples:
                          - 5000
                      total_balance:
                        type: number
                        examples:
                          - 129500
                examples:
                  - success: true
                    data:
                      currency: XAF
                      available_balance: 124500
                      pending_balance: 5000
                      total_balance: 129500
      tags:
        - Balance
  /api/v1/bills:
    get:
      summary: List available bill services
      operationId: listAvailableBillServices
      description: |-
        Returns the list of bill services your app can pay (electricity, water,
        TV, etc.), optionally filtered by category. The service `code` returned
        here is what you pass to `/bills/get-bill` and `/bills/pay`.
      parameters:
        - in: query
          name: category
          description: Filter by category.
          required: false
          schema:
            type: string
            description: Filter by category.
            examples:
              - electricity
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  data:
                    type: object
                    properties:
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              examples:
                                - eneo_postpaid
                            name:
                              type: string
                              examples:
                                - ENEO Postpaid
                            category:
                              type: string
                              examples:
                                - electricity
                            type:
                              type: string
                              examples:
                                - bill
                            description:
                              type: string
                              examples:
                                - Pay your ENEO postpaid electricity bill
                            currency:
                              type: string
                              examples:
                                - XAF
                            min_amount:
                              type: integer
                              examples:
                                - 500
                            max_amount:
                              type: integer
                              examples:
                                - 500000
                        examples:
                          - - code: eneo_postpaid
                              name: ENEO Postpaid
                              category: electricity
                              type: bill
                              description: Pay your ENEO postpaid electricity bill
                              currency: XAF
                              min_amount: 500
                              max_amount: 500000
                      categories:
                        type: array
                        items:
                          type: string
                        examples:
                          - - electricity
                            - water
                            - tv
                      total:
                        type: integer
                        examples:
                          - 1
                examples:
                  - success: true
                    data:
                      services:
                        - code: eneo_postpaid
                          name: ENEO Postpaid
                          category: electricity
                          type: bill
                          description: Pay your ENEO postpaid electricity bill
                          currency: XAF
                          min_amount: 500
                          max_amount: 500000
                      categories:
                        - electricity
                        - water
                        - tv
                      total: 1
      tags:
        - Bills
  /api/v1/bills/get-bill:
    post:
      summary: Get bill details
      operationId: getBillDetails
      description: |-
        Fetch the outstanding bill amount and customer details for a given
        service and account number. Call this before `/bills/pay` to show your
        customer what they owe.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  data:
                    type: object
                    properties:
                      service:
                        type: string
                        examples:
                          - ENEO Postpaid
                      account_number:
                        type: string
                        examples:
                          - "1234567890"
                      bill_info:
                        type: object
                        properties:
                          customer_name:
                            type: string
                            examples:
                              - John Doe
                          amount_due:
                            type: number
                            examples:
                              - 15400
                          currency:
                            type: string
                            examples:
                              - XAF
                          due_date:
                            type: string
                            examples:
                              - 2026-06-15
                          bill_reference:
                            type: string
                            examples:
                              - BILL-2026-0042
                examples:
                  - success: true
                    data:
                      service: ENEO Postpaid
                      account_number: "1234567890"
                      bill_info:
                        customer_name: John Doe
                        amount_due: 15400
                        currency: XAF
                        due_date: 2026-06-15
                        bill_reference: BILL-2026-0042
        "422":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - The service code field is required.
                  errors:
                    type: object
                    properties:
                      service_code:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The service code field is required.
                      account_number:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The account number field is required.
                examples:
                  - message: The service code field is required.
                    errors:
                      service_code:
                        - The service code field is required.
                      account_number:
                        - The account number field is required.
      tags:
        - Bills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_code:
                  type: string
                  description: The service code from `/bills` (a config code or an active bill
                    channel code, e.g. CAMTEL_AIRTIME_CMR).
                  examples:
                    - eneo_postpaid
                account_number:
                  type: string
                  description: The customer's account/meter/contract number. Required for
                    lookup-based services (bill, searchable_bill, subscription);
                    NOT required for topup/product (airtime, data, TV).
                  examples:
                    - "1234567890"
              required:
                - service_code
  /api/v1/bills/pay:
    post:
      summary: Pay a bill
      operationId: payABill
      description: |-
        Charge the customer and settle the bill with the service provider. The
        customer will receive a mobile money prompt to authorize the charge.
      parameters: []
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                        examples:
                          - BILL_ABC123DEF456
                      type:
                        type: string
                        examples:
                          - BILL
                      status:
                        type: string
                        examples:
                          - pending
                      amount:
                        type: object
                        properties:
                          total:
                            type: number
                            examples:
                              - 15400
                          currency:
                            type: string
                            examples:
                              - XAF
                      payment:
                        type: object
                        properties:
                          method:
                            type: string
                            examples:
                              - maviance
                      customer:
                        type: object
                        properties:
                          phone:
                            type: string
                            examples:
                              - "+237600000000"
                          name:
                            type: string
                            examples:
                              - John Doe
                      metadata:
                        type: object
                        properties:
                          service_code:
                            type: string
                            examples:
                              - eneo_postpaid
                          service_name:
                            type: string
                            examples:
                              - ENEO Postpaid
                          account_number:
                            type: string
                            examples:
                              - "1234567890"
                          category:
                            type: string
                            examples:
                              - electricity
                      created_at:
                        type: string
                        examples:
                          - 2026-05-20T10:30:00+00:00
                examples:
                  - success: true
                    data:
                      transaction_id: BILL_ABC123DEF456
                      type: BILL
                      status: pending
                      amount:
                        total: 15400
                        currency: XAF
                      payment:
                        method: maviance
                      customer:
                        phone: "+237600000000"
                        name: John Doe
                      metadata:
                        service_code: eneo_postpaid
                        service_name: ENEO Postpaid
                        account_number: "1234567890"
                        category: electricity
                      created_at: 2026-05-20T10:30:00+00:00
        "422":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - The amount must be at least 1.
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The amount must be at least 1.
                      customer_phone:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The customer phone field is required.
                examples:
                  - message: The amount must be at least 1.
                    errors:
                      amount:
                        - The amount must be at least 1.
                      customer_phone:
                        - The customer phone field is required.
      tags:
        - Bills
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_code:
                  type: string
                  description: ""
                  examples:
                    - eneo_postpaid
                account_number:
                  type: string
                  description: ""
                  examples:
                    - "1234567890"
                amount:
                  type: number
                  description: Amount to pay in the service's currency.
                  examples:
                    - 15400
                customer_phone:
                  type: string
                  description: Mobile money number that will be charged.
                  examples:
                    - "+237600000000"
                customer_name:
                  type: string
                  description: Customer's display name.
                  examples:
                    - John Doe
                customer_email:
                  type: string
                  description: Optional receipt email.
                  examples:
                    - john@example.com
                reference:
                  type: string
                  description: Your own reference for reconciliation.
                  examples:
                    - ORDER-123
                item_id:
                  type: string
                  description: Optional payable item id returned by `/bills/get-bill`.
                  examples:
                    - pi-9988
              required:
                - service_code
                - account_number
                - amount
                - customer_phone
  /api/v1/widget/card-payment:
    get:
      summary: Display the card payment widget
      operationId: displayTheCardPaymentWidget
      description: |-
        Returns a mobile-optimized HTML page you can embed in a WebView (mobile
        apps) or iframe (web) to collect card details. The widget uses Stripe
        Elements under the hood — PCI-compliant, with 3D Secure built in.

        The widget posts `postMessage` events back to the parent window at each
        step: `payment_success`, `payment_failed`, `payment_cancelled`.
      parameters:
        - in: query
          name: amount
          description: Amount to charge. Minimum 0.50.
          required: true
          schema:
            type: number
            description: Amount to charge. Minimum 0.50.
            examples:
              - 100
        - in: query
          name: currency
          description: Currency code — USD, EUR, GBP, XAF, XOF. Default USD.
          required: false
          schema:
            type: string
            description: Currency code — USD, EUR, GBP, XAF, XOF. Default USD.
            examples:
              - USD
        - in: query
          name: reference
          description: Your internal reference (order id, invoice number).
          required: false
          schema:
            type: string
            description: Your internal reference (order id, invoice number).
            examples:
              - ORDER-12345
        - in: query
          name: description
          description: Shown to the customer on the payment page.
          required: false
          schema:
            type: string
            description: Shown to the customer on the payment page.
            examples:
              - Product Purchase
        - in: query
          name: customer_name
          description: Prefills the cardholder name field.
          required: false
          schema:
            type: string
            description: Prefills the cardholder name field.
            examples:
              - Marie Tchana
        - in: query
          name: customer_email
          description: Prefills the email field for receipts.
          required: false
          schema:
            type: string
            description: Prefills the email field for receipts.
            examples:
              - marie@example.com
      responses:
        "200":
          description: Widget HTML
          content:
            application/json:
              schema:
                type: string
                examples:
                  - <!doctype html>… (mobile-optimized card form)
        "400":
          description: Missing amount
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - Invalid payment parameters
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The amount field is required.
                examples:
                  - message: Invalid payment parameters
                    errors:
                      amount:
                        - The amount field is required.
      tags:
        - Cards
  /api/v1/card-payment/init:
    post:
      summary: Get the Stripe publishable key
      operationId: getTheStripePublishableKey
      description: |-
        Returns the publishable key for initializing Stripe Elements in your
        own frontend. Safe to expose — it can only tokenize cards, not charge
        them. Use the returned key with `Stripe(publishableKey)`.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_id:
                    type: string
                    examples:
                      - pk_live_XXXXXXXXXXXXXXXXXXXXXXXX
                examples:
                  - app_id: pk_live_XXXXXXXXXXXXXXXXXXXXXXXX
      tags:
        - Cards
  /api/v1/card-payment/process:
    post:
      summary: Process a card payment
      operationId: processACardPayment
      description: |-
        Server-side card charge. Collect the card client-side with Stripe
        Elements to get a `payment_method_id`, then POST it here. If the
        issuing bank requires 3D Secure, the response contains
        `requires_action: true` and a `payment_intent_client_secret` you pass
        to `stripe.confirmCardPayment()` in the browser to complete SCA.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - description: Payment succeeded
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - true
                      message:
                        type: string
                        examples:
                          - Payment successful
                      data:
                        type: object
                        properties:
                          transaction_id:
                            type: string
                            examples:
                              - CARD_ABCDEF1234567890
                          amount:
                            type: number
                            examples:
                              - 100
                          currency:
                            type: string
                            examples:
                              - USD
                          status:
                            type: string
                            examples:
                              - completed
                          payment_method:
                            type: string
                            examples:
                              - card
                          fees:
                            type: number
                            examples:
                              - 2.5
                    examples:
                      - success: true
                        message: Payment successful
                        data:
                          transaction_id: CARD_ABCDEF1234567890
                          amount: 100
                          currency: USD
                          status: completed
                          payment_method: card
                          fees: 2.5
                  - description: 3D Secure required
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - true
                      status:
                        type: string
                        examples:
                          - requires_action
                      requires_action:
                        type: boolean
                        examples:
                          - true
                      payment_intent_client_secret:
                        type: string
                        examples:
                          - pi_XXX_secret_YYY
                      payment_intent_id:
                        type: string
                        examples:
                          - pi_XXX
                      transaction_id:
                        type: string
                        examples:
                          - CARD_ABCDEF1234567890
                      next_action:
                        type: object
                        properties:
                          type:
                            type: string
                            examples:
                              - use_stripe_sdk
                          handler:
                            type: string
                            examples:
                              - stripe.confirmCardPayment(payment_intent_client_secret)
                          then:
                            type: string
                            examples:
                              - POST /api/v1/card-payment/confirm with
                                {transaction_id, payment_intent_id}
                      message:
                        type: string
                        examples:
                          - Additional authentication required
                    examples:
                      - success: true
                        status: requires_action
                        requires_action: true
                        payment_intent_client_secret: pi_XXX_secret_YYY
                        payment_intent_id: pi_XXX
                        transaction_id: CARD_ABCDEF1234567890
                        next_action:
                          type: use_stripe_sdk
                          handler: stripe.confirmCardPayment(payment_intent_client_secret)
                          then: POST /api/v1/card-payment/confirm with {transaction_id, payment_intent_id}
                        message: Additional authentication required
        "400":
          description: ""
          content:
            application/json:
              schema:
                oneOf:
                  - description: 3D Secure failed — start a new attempt
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - false
                      status:
                        type: string
                        examples:
                          - failed
                      transaction_id:
                        type: string
                        examples:
                          - CARD_ABCDEF1234567890
                      error:
                        type: string
                        examples:
                          - CARD_AUTHENTICATION_FAILED
                      message:
                        type: string
                        examples:
                          - The provided PaymentMethod has failed authentication.
                      retryable:
                        type: boolean
                        examples:
                          - true
                    examples:
                      - success: false
                        status: failed
                        transaction_id: CARD_ABCDEF1234567890
                        error: CARD_AUTHENTICATION_FAILED
                        message: The provided PaymentMethod has failed authentication.
                        retryable: true
                  - description: Card declined
                    type: object
                    properties:
                      success:
                        type: boolean
                        examples:
                          - false
                      message:
                        type: string
                        examples:
                          - Your card was declined. Please try another card.
                      error:
                        type: string
                        examples:
                          - STRIPE_ERROR
                    examples:
                      - success: false
                        message: Your card was declined. Please try another card.
                        error: STRIPE_ERROR
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - The given data was invalid.
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        items:
                          type: string
                        examples:
                          - - The amount must be at least 0.5.
                examples:
                  - message: The given data was invalid.
                    errors:
                      amount:
                        - The amount must be at least 0.5.
      tags:
        - Cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: Amount to charge. Minimum 0.50.
                  examples:
                    - 100
                currency:
                  type: string
                  description: Currency code — USD, EUR, GBP, XAF, XOF.
                  examples:
                    - USD
                customer_name:
                  type: string
                  description: Cardholder name.
                  examples:
                    - Marie Tchana
                payment_method_id:
                  type: string
                  description: Stripe PaymentMethod id from your client-side Stripe Elements. If
                    omitted, the response returns a client_secret for you to
                    finalize the charge in the browser.
                  examples:
                    - pm_1PfXXXXXXXXXXXXXXXXX
                customer_email:
                  type: string
                  description: Email address for the receipt.
                  examples:
                    - marie@example.com
                reference:
                  type: string
                  description: Your internal reference (order id, invoice number).
                  examples:
                    - ORDER-12345
                description:
                  type: string
                  description: Descriptor shown on the bank statement.
                  examples:
                    - "Commande #12345"
              required:
                - amount
                - currency
                - customer_name
  /api/v1/card-payment/confirm:
    post:
      summary: Confirm a card payment after 3D Secure
      operationId: confirmACardPaymentAfter3DSecure
      description: |-
        Call this after `stripe.confirmCardPayment()` succeeds in the browser
        to sync the final state back to the transaction. We re-read the
        PaymentIntent from Stripe and mark the transaction completed or
        failed based on its status.

        You don't need this endpoint for cards that don't require 3D Secure —
        `POST /card-payment/process` already returns the completed transaction
        inline in that case.
      parameters: []
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - true
                  message:
                    type: string
                    examples:
                      - Payment confirmed successfully
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                        examples:
                          - CARD_ABCDEF1234567890
                      amount:
                        type: number
                        examples:
                          - 100
                      currency:
                        type: string
                        examples:
                          - USD
                      status:
                        type: string
                        examples:
                          - completed
                      payment_method:
                        type: string
                        examples:
                          - card
                examples:
                  - success: true
                    message: Payment confirmed successfully
                    data:
                      transaction_id: CARD_ABCDEF1234567890
                      amount: 100
                      currency: USD
                      status: completed
                      payment_method: card
        "400":
          description: 3DS failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - Your card was declined.
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: string
                        examples:
                          - CARD_ABCDEF1234567890
                      status:
                        type: string
                        examples:
                          - failed
                  error:
                    type: string
                    examples:
                      - PAYMENT_FAILED
                examples:
                  - success: false
                    message: Your card was declined.
                    data:
                      transaction_id: CARD_ABCDEF1234567890
                      status: failed
                    error: PAYMENT_FAILED
        "404":
          description: Unknown transaction
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    examples:
                      - false
                  message:
                    type: string
                    examples:
                      - Transaction not found
                  error:
                    type: string
                    examples:
                      - TRANSACTION_NOT_FOUND
                examples:
                  - success: false
                    message: Transaction not found
                    error: TRANSACTION_NOT_FOUND
      tags:
        - Cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_id:
                  type: string
                  description: The Elgiopay transaction id returned by /card-payment/process.
                  examples:
                    - CARD_ABCDEF1234567890
                payment_intent_id:
                  type: string
                  description: The Stripe PaymentIntent id returned by /card-payment/process.
                  examples:
                    - pi_XXXXXXXXXXXXXXXXXXXXXXXX
              required:
                - transaction_id
                - payment_intent_id
