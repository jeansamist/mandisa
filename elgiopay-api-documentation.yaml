                  examples:
                    - n
                customer_email:
                  type:
                    - string
                    - "null"
                  description: >-
                    `nullable`, not `sometimes`: `sometimes` only skips
                    validation when

                    the key is ABSENT, so a client serialising an optional field
                    as

                    explicit null got "must be a valid email address". Nothing
                    emails

                    the customer and the column is nullable, so null is fine.
                    Must be a valid email address. Must not be greater than 255
                    characters.
                  examples:
                    - ashly64@example.com
                reference:
                  type: string
                  description: Must not be greater than 255 characters.
                  examples:
                    - v
                metadata:
                  type: object
                  description: ""
                  properties: {}
                  examples:
                    - null
                surcharge:
                  type: number
                  description: Must be at least 0.
                  examples:
                    - 42
                sub_merchant_id:
                  type: string
                  description: Route the payment to a connected merchant (platform apps only).
                    Must not be greater than 64 characters.
                  examples:
                    - l
              required:
                - amount
                - customer_phone
