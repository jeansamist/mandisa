      summary: Verify a payment
      operationId: verifyAPayment
      description: >-
        Force a live verification of the transaction against the payment
        provider

        and update its status. Useful when a webhook was missed or you want to

        confirm a payment before delivering goods.
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction_id:
                    type: string
                    examples:
                      - TXN_ABC123DEF456
                  type:
                    type: string
                    examples:
                      - CHARGE
                  status:
                    type: string
                    examples:
                      - completed
                  amount:
                    type: object
                    properties:
                      total:
                        type: number
                        examples:
                          - 1000
                      currency:
                        type: string
                        examples:
                          - XAF
                  payment:
                    type: object
                    properties:
                      method:
                        type: string
                        examples:
                          - mtn_mobile_money
                  customer:
                    type: object
                    properties:
                      phone:
                        type: string
                        examples:
                          - "+237600000000"
                  created_at:
                    type: string
                    examples:
                      - 2026-05-20T10:30:00+00:00
                  completed_at:
                    type: string
                    examples:
                      - 2026-05-20T10:32:15+00:00
                examples:
                  - transaction_id: TXN_ABC123DEF456
                    type: CHARGE
                    status: completed
                    amount:
                      total: 1000
                      currency: XAF
                    payment:
                      method: mtn_mobile_money
                    customer:
