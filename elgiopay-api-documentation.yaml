                    - string
                    - "null"
                  description: >-
                    Legacy fixed method OR an explicit payment-channel code (any

                    active collect channel, e.g. AIRTEL_GAB). Exactly one is
                    required. This field is required when
                    <code>channel_code</code> is not present.
                  enum:
                    - mtn_mobile_money
                    - orange_money
                  examples:
                    - mtn_mobile_money
                channel_code:
                  type:
                    - string
                    - "null"
                  description: This field is required when <code>payment_method</code> is not
